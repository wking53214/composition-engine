name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      # The package resolves as `composition_engine` for an installed copy, not just under
      # pytest's pythonpath. Checked separately because the two paths are
      # what disagreed before pyproject.toml existed.
      - name: Import check
        run: python -c "import composition_engine; print(composition_engine.__file__)"
